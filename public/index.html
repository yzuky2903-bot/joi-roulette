<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roleta JOI Casal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Tela de entrada -->
  <div id="login-screen" class="screen">
    <div class="card">
      <h1>🔥 Roleta JOI Casal</h1>
      <p class="subtitle">Roleta compartilhada + Chat em tempo real</p>
      
      <input type="text" id="name-input" placeholder="Seu nome" maxlength="20">
      
      <div class="gender-select">
        <label>
          <input type="radio" name="gender" value="male" checked> Homem
        </label>
        <label>
          <input type="radio" name="gender" value="female"> Mulher
        </label>
      </div>

      <input type="text" id="room-input" placeholder="Código da sala (ex: AMOR123)" maxlength="10">
      
      <button id="join-btn">Entrar na Sala</button>
      <p class="hint">Crie um código e mande pra ela. Os dois usam o mesmo código.</p>
    </div>
  </div>

  <!-- Tela principal do jogo -->
  <div id="game-screen" class="screen hidden">
    <header>
      <div class="room-info">
        Sala: <strong id="room-code-display"></strong>
      </div>
      <div class="users-online" id="users-list"></div>
    </header>

    <main>
      <!-- Roleta -->
      <section class="roulette-section">
        <div class="wheel-container">
          <div id="wheel" class="wheel">
            <div class="wheel-center">JOI</div>
          </div>
          <div class="pointer"></div>
        </div>

        <div class="spin-buttons">
          <button id="spin-btn" class="spin-btn both">🎡 Girar para os Dois</button>
        </div>

        <div class="auto-spin-row">
          <label class="auto-spin-toggle">
            <input type="checkbox" id="auto-spin-check" checked>
            <span>Auto-girar quando os dois terminarem</span>
          </label>
        </div>

        <div id="result-box" class="result-box hidden">
          <!-- Desafio ELE -->
          <div class="challenge-card male-card">
            <div class="challenge-header">♂ Ordem para ELE</div>
            <div class="challenge-text" id="male-text"></div>
            <div class="timer-block">
              <div class="timer-display" id="male-timer">00:00</div>
              <div class="timer-bar-bg">
                <div class="timer-bar" id="male-bar"></div>
              </div>
              <div class="side-status" id="male-status"></div>
            </div>
          </div>

          <!-- Desafio ELA -->
          <div class="challenge-card female-card">
            <div class="challenge-header">♀ Ordem para ELA</div>
            <div class="challenge-text" id="female-text"></div>
            <div class="timer-block">
              <div class="timer-display" id="female-timer">00:00</div>
              <div class="timer-bar-bg">
                <div class="timer-bar" id="female-bar"></div>
              </div>
              <div class="side-status" id="female-status"></div>
            </div>
          </div>

          <div class="result-by" id="result-by"></div>

          <!-- Botão Gozou -->
          <button id="cum-btn" class="cum-btn">💦 GOZOU!</button>
        </div>
      </section>

      <!-- Chat -->
      <section class="chat-section">
        <div id="chat-messages" class="chat-messages"></div>
        <div class="chat-input-area">
          <input type="text" id="chat-input" placeholder="Digite sua mensagem..." maxlength="200">
          <button id="send-btn">Enviar</button>
        </div>
      </section>
    </main>
  </div>

  <!-- Overlay de animação de gozada -->
  <div id="cum-overlay" class="cum-overlay hidden">
    <div class="cum-scene">
      <div class="penis-container">
        <div class="penis-shaft">
          <div class="penis-head"></div>
          <div class="veins"></div>
        </div>
        <div class="balls">
          <div class="ball left"></div>
          <div class="ball right"></div>
        </div>
      </div>
      <div class="cum-streams">
        <div class="stream s1"></div>
        <div class="stream s2"></div>
        <div class="stream s3"></div>
        <div class="stream s4"></div>
        <div class="stream s5"></div>
        <div class="stream s6"></div>
        <div class="stream s7"></div>
      </div>
      <div class="cum-drops">
        <div class="drop d1"></div>
        <div class="drop d2"></div>
        <div class="drop d3"></div>
        <div class="drop d4"></div>
        <div class="drop d5"></div>
      </div>
      <div class="cum-text" id="cum-text">GOZOU! 💦</div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js"></script>
</body>
</html>
